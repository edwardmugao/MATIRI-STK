<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>St. Orsola Hospital · M-PESA STK Push</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">

        <!-- LOGO -->
        <div style="display:flex; justify-content:center; margin-bottom:10px;">
          <div style="background:white; padding:10px; border-radius:50%; width:70px; height:70px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
            
            <!-- Hospital Icon SVG -->
            <svg width="40" height="40" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="48" fill="#1f8a4d"/>
              <path d="M30 50 H70 M50 30 V70" stroke="white" stroke-width="8" stroke-linecap="round"/>
              <circle cx="50" cy="50" r="6" fill="white"/>
            </svg>
      
          </div>
        </div>
      
        <h1>St. Orsola Hospital</h1>
        <p>Matiri · Mission Healthcare</p>
        <p style="display:inline-block;padding:6px 14px;background:rgba(245, 245, 7, 0.15);border:1px solid #d4af37;color:#051813;font-weight:700;border-radius:20px;font-size:12px;letter-spacing:1px;text-transform:uppercase;text-align:center;">
            Secure M-PESA STK Payment System
          </p>
      </div> 

  <div class="form">

    <!-- FULL NAME -->
    <label>Full Name</label>
    <div class="input-group">
      <span class="icon">👤</span>
      <input type="text" id="fullName" placeholder="Enter full name">
    </div>

    <!-- PHONE -->
    <label>Phone Number</label>
    <div class="input-group">
        <span class="icon">🇰🇪</span>
      <input type="tel" id="phone" placeholder="07XXXXXXXX">
    </div>

    <!-- DEPARTMENT -->
    <label>Department</label>
    <div class="input-group">
      <span class="icon">🏥</span>
      <select id="department">
        <option>Outpatient</option>
        <option>Inpatient</option>
        <option>Pharmacy</option>
        <option>Laboratory</option>
        <option>Maternity</option>
        <option>Emergency</option>
      </select>
    </div>

    <!-- AMOUNT -->
    <label>Amount (KES)</label>
    <div class="input-group">
      <span class="icon">💰</span>
      <input type="number" id="amount" placeholder="0000">
    </div>

    <div class="buttons">
        <button class="stk-btn" onclick="stkPush()">
            📱 STK PUSH <span class="arrow">→</span>
          </button>
      <button class="cancel" onclick="resetForm()">CANCEL</button>
    </div>

  </div>
</div>

<!-- POPUP -->
<div class="popup" id="popup"></div>

<script>
/* =========================
   CAPITALIZE FULL NAME
========================= */
function capitalizeName(str) {
  return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

/* LIVE NAME CAPITALIZATION */
document.getElementById("fullName").addEventListener("input", function () {
  this.value = capitalizeName(this.value);
});

/* =========================
   STK PUSH SIMULATION
========================= */
function stkPush() {
  let name = document.getElementById("fullName").value;
  let phone = document.getElementById("phone").value;
  let dept = document.getElementById("department").value;
  let amount = document.getElementById("amount").value;

  if (!name || !phone || !amount) {
    alert("Fill all fields");
    return;
  }

  let code = "MPESA" + Math.floor(Math.random() * 99999);

  showPopup(`STK Sent ✔ ${name} | ${dept} | KES ${amount} | ${code}`);

  setTimeout(() => {
    resetForm();
  }, 2000);
}

/* =========================
   RESET FORM
========================= */
function resetForm() {
  document.getElementById("fullName").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("amount").value = "";
}

/* =========================
   POPUP SYSTEM (5s)
========================= */
function showPopup(msg) {
  let popup = document.getElementById("popup");
  popup.innerText = msg;
  popup.style.display = "block";

  setTimeout(() => {
    popup.style.display = "none";
  }, 5000);
}
</script>

</body>
</html>
